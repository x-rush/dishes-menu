services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Local: set VITE_BASE_PATH=/ in .env so SPA hits Gin at root.
        # Prod (deploy.sh): .env is not shipped → falls back to /forxt/.
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/forxt/dishes-menu/}
    image: dishes-menu:latest
    container_name: dishes-menu
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=8080
      - MYSQL_DSN=${MYSQL_DSN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
